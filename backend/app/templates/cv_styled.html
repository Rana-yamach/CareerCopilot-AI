<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>{{ name }} - CV</title>
<style>
  @page { size: A4; margin: 1.8cm; }
  body {
    font-family: "DejaVu Sans", "Noto Sans", sans-serif;
    color: #1f2937;
    font-size: 10.5pt;
    line-height: 1.55;
  }
  .header {
    border-bottom: 3px solid #2563eb;
    padding-bottom: 10px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 22pt;
    margin: 0 0 4px 0;
    color: #111827;
    letter-spacing: 0.5px;
  }
  .contact {
    color: #4b5563;
    font-size: 9.5pt;
  }
  .contact span { margin-right: 12px; }
  .section-title {
    font-size: 12.5pt;
    color: #2563eb;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid #dbeafe;
    padding-bottom: 3px;
    margin-top: 18px;
    margin-bottom: 8px;
  }
  pre {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: "DejaVu Sans", "Noto Sans", sans-serif;
    font-size: 10.5pt;
    margin: 0;
  }
  .footer-note {
    margin-top: 24px;
    font-size: 8pt;
    color: #9ca3af;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>{{ name }}</h1>
    <div class="contact">{{ email }}</div>
  </div>
  <div class="section-title">Özgeçmiş</div>
  <pre>{{ body_text }}</pre>
  <div class="footer-note">CareerCopilot AI ile oluşturulmuştur</div>
</body>
</html>
