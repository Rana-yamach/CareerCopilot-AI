[project]
name = "careercopilot-backend"
version = "0.1.0"
description = "CareerCopilot AI - Backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.27.1",
    "python-multipart==0.0.9",
    "pydantic==2.6.1",
    "pydantic-settings==2.1.0",
    "email-validator==2.1.0.post1",
    "sqlalchemy==2.0.27",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.1",
    "pgvector==0.2.5",
    "celery==5.3.6",
    "redis==5.0.1",
    "PyMuPDF==1.23.26",
    "python-docx==1.1.0",
    "PyGithub==2.2.0",
    "weasyprint==61.2",
    "pydyf==0.10.0",  # weasyprint==61.2 ile uyumlu; pydyf>=0.11 breaking API değişikliği içerir
    "jinja2==3.1.3",
    "sentence-transformers==2.5.1",
    "huggingface_hub==0.20.3",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.2",
    "httpx==0.26.0",
    "tenacity==8.2.3",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
test = [
    "pytest==8.0.1",
    "pytest-asyncio==0.23.5",
]

# Not: Bu proje bir Python paketi olarak build/install edilmez (uygulama kodu
# doğrudan çalıştırılır). Docker imajı bağımlılıkları `requirements.txt`
# üzerinden kurar; bu dosya yalnızca bağımlılık/metadata dokümantasyonu
# amacıyla (TASK-101) tutulur ve requirements.txt ile senkron kalmalıdır.
