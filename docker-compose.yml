services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: careercopilot-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: careercopilot
      POSTGRES_PASSWORD: careercopilot
      POSTGRES_DB: careercopilot
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careercopilot -d careercopilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: careercopilot-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careercopilot-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careercopilot-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=solo
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgvector_data:
  backend_uploads:
